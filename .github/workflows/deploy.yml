name: CI/CD Pipeline

on:
  push:
    branches:
      - prod

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # Checkout do repositório
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================
      # Configurar Node.js
      # ========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app-gs/package-lock.json

      # ========================================
      # Instalar dependências
      # ========================================

      - name: Install dependencies
        working-directory: app-gs
        run: npm ci

      # ========================================
      # Build React
      # ========================================

      - name: Build React Project
        working-directory: app-gs
        run: npm run build

      # ========================================
      # Deploy para S3
      # ========================================

      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          AWS_S3_BUCKET: portifolio-website-452408242851-us-east-1-an

          AWS_REGION: us-east-1

          SOURCE_DIR: app-gs/dist